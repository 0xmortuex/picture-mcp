[project]
name = "picture-mcp"
version = "0.1.0"
description = "MCP server for everyday image jobs by intent: info, resize, convert, compress to a target size, strip GPS/EXIF, rotate, crop, contact sheet, favicons, batch, palette. Pillow only, no system dependencies, directory sandbox."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "Pillow>=10.1",
]
keywords = ["mcp", "image", "pillow", "resize", "compress", "exif", "privacy", "favicon", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/picture-mcp"

[project.scripts]
picture-mcp = "picture_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picture_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = ["pillow_heif.*"]
ignore_missing_imports = true
